dding:40px 24px;margin:30px 0;text-align:center}.login-box p,.denied-box p{color:var(--muted);font-size:15px;margin-bottom:20px}.denied-box{border-color:rgba(185,28,28,.25)}.denied-box .email{color:var(--red);font-weight:600}.login-error{color:var(--red);font-size:14px;margin-top:14px;min-height:18px}#admin-box{display:none}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 14px}.section-head h2{font-size:19px}.pending-count{display:inline-block;background:var(--amber-l);color:var(--amber);font-size:13px;font-weight:700;padding:3px 11px;border-radius:20px;margin-left:8px}.rejected-count{display:inline-block;background:var(--bd);color:var(--muted);font-size:13px;font-weight:700;padding:3px 11px;border-radius:20px;margin-left:8px}.top-bar{display:flex;justify-content:flex-end;padding:14px 0 0}.review-list{display:flex;flex-direction:column;gap:16px;margin-bottom:30px}.review-card{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);padding:20px 22px}.review-meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{display:flex;flex-direction:column;gap:5px}.form-field.full{grid-column:1/-1}.form-field label{font-size:13px;color:var(--teal-d);font-weight:600}.form-field input,.form-field select,.form-field textarea{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--white);color:var(--text)}.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:2px solid var(--teal);outline-offset:1px}.form-field textarea{resize:vertical;min-height:60px}.form-section-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px}.review-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}.review-msg{font-size:13.5px;min-height:18px;flex:1 1 100%}.review-msg-error{color:var(--red);font-weight:600}.empty-queue{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px;background:var(--white);border:1px dashed var(--bd);border-radius:var(--r)}.rejected-toggle-wrap{text-align:center;margin:10px 0 30px}.rejected-list{display:none;flex-direction:column;gap:12px;margin-top:16px}.rejected-card{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;opacity:.85}.rejected-card h4{font-size:15.5px;color:var(--text);margin-bottom:4px}.rejected-card .review-meta{margin-bottom:8px}.rejected-card .actions{margin-top:10px}#state-box{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}#state-box .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}}</style></head><body><header class="site"><div class="bar"><a href="index.html" class="logo">🩺 Rex Nursing <small>護理國考站</small></a><nav><a href="index.html">首頁</a> <a href="salary.html">薪資查詢</a></nav></div></header><div class="breadcrumb"><a href="index.html">首頁</a> ／ <a href="salary.html">護理師薪資查詢</a> ／ 審核後台</div><div class="wrap"><div class="hero"><span class="kicker">🔒 站內限定</span><h1>薪資回報審核</h1><p class="sub">審核訪客回報的薪資資訊，核准後才會顯示在公開查詢頁。</p></div>

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTZqe69W7bOsKypP-dbI5IUllWpVkGUWs",
  authDomain: "rex-nursing-quiz.firebaseapp.com",
  projectId: "rex-nursing-quiz",
  storageBucket: "rex-nursing-quiz.firebasestorage.app",
  messagingSenderId: "71721098366",
  appId: "1:71721098366:web:69245631ae7810c3978c2f",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = 'rexnursing@gmail.com';

const REGION_ORDER = ['台北市','新北市','桃園市','台中市','台南市','高雄市','基隆市','新竹市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','屏東縣','宜蘭縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣'];
const TIER_OPTIONS = ['醫學中心','區域醫院','地區醫院','診所','軍職醫院'];
const CIVIL_OPTIONS = ['是','否','不確定'];
const TENURE_OPTIONS = ['未滿1年','1-3年','3-5年','5-7年','7-9年','9-12年','12年以上','不確定'];
const LADDER_OPTIONS = ['N0','N1','N2','N3','N4','不適用'];
const UNIT_OPTIONS = ['病房','ICU/加護','OR/手術室','急診','門診','產房','洗腎室','精神科','其他'];

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function optSelect(name, options, current, allowEmpty, emptyLabel) {
  const opts = [];
  if (allowEmpty) opts.push(`<option value=""${!current ? ' selected' : ''}>${esc(emptyLabel || '')}</option>`);
  options.forEach(o => opts.push(`<option value="${esc(o)}"${o === current ? ' selected' : ''}>${esc(o)}</option>`));
  return `<select name="${name}">${opts.join('')}</select>`;
}

function fmtTime(ts) {
  if (!ts || !ts.toDate) return '—';
  return ts.toDate().toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function reviewCardHtml(id, r) {
  return `<div class="review-card" data-id="${esc(id)}">
    <div class="review-meta">回報時間：${esc(fmtTime(r.createdAt))} · 文件 ID：${esc(id)}</div>
    <div class="form-grid">
      <div class="form-field full"><label>醫院名稱</label><input type="text" name="hospitalName" maxlength="60" value="${esc(r.hospitalName || '')}"></div>
      <div class="form-field"><label>地區</label>${optSelect('region', REGION_ORDER, r.region, false)}</div>
      <div class="form-field"><label>醫院層級</label>${optSelect('hospitalTier', TIER_OPTIONS, r.hospitalTier, false)}</div>
      <div class="form-field"><label>是否為公職</label>${optSelect('isCivilService', CIVIL_OPTIONS, r.isCivilService, false)}</div>
      <div class="form-field"><label>年資範圍</label>${optSelect('tenureRange', TENURE_OPTIONS, r.tenureRange, false)}</div>
    </div>
    <div class="form-section-label">選填欄位</div>
    <div class="form-grid">
      <div class="form-field"><label>護理階梯</label>${optSelect('nurseLadder', LADDER_OPTIONS, r.nurseLadder, true, '不提供')}</div>
      <div class="form-field"><label>單位別</label>${optSelect('unitType', UNIT_OPTIONS, r.unitType, true, '不提供')}</div>
      <div class="form-field"><label>底薪（元）</label><input type="number" name="baseSalary" min="0" max="500000" value="${r.baseSalary != null ? esc(r.baseSalary) : ''}"></div>
      <div class="form-field"><label>小夜津貼（元）</label><input type="number" name="eveningDiff" min="0" max="5000" value="${r.eveningDiff != null ? esc(r.eveningDiff) : ''}"></div>
      <div class="form-field"><label>大夜津貼（元）</label><input type="number" name="nightDiff" min="0" max="5000" value="${r.nightDiff != null ? esc(r.nightDiff) : ''}"></div>
      <div class="form-field"><label>年終獎金</label><input type="text" name="yearEndBonus" maxlength="50" value="${esc(r.yearEndBonus || '')}"></div>
      <div class="form-field full"><label>推估年薪（元）</label><input type="number" name="estimatedAnnualSalary" min="0" max="5000000" value="${r.estimatedAnnualSalary != null ? esc(r.estimatedAnnualSalary) : ''}"></div>
      <div class="form-field full"><label>其他備註</label><textarea name="notes" maxlength="500">${esc(r.notes || '')}</textarea></div>
    </div>
    <div class="review-actions">
      <button type="button" class="btn-approve" data-action="approve">✅ 核准</button>
      <button type="button" class="btn-reject" data-action="reject">🚫 退回</button>
      <div class="review-msg"></div>
    </div>
  </div>`;
}

function rejectedCardHtml(id, r) {
  return `<div class="rejected-card" data-id="${esc(id)}">
    <h4>${esc(r.hospitalName || '（未填）')}</h4>
    <div class="review-meta">${esc(r.region || '')} · 回報時間：${esc(fmtTime(r.createdAt))} · 退回時間：${esc(fmtTime(r.reviewedAt))}</div>
    <div class="actions"><button type="button" class="btn-restore" data-action="restore">↩️ 恢復為待審核</button></div>
  </div>`;
}

function optionalNumber(raw, max) {
  if (raw === '' || raw === null || raw === undefined) return { present: false };
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0 || n > max) return { present: true, valid: false };
  return { present: true, valid: true, value: n };
}

function collectAndValidate(cardEl) {
  const get = (name) => cardEl.querySelector(`[name="${name}"]`).value;
  const hospitalName = get('hospitalName').trim();
  const region = get('region');
  const hospitalTier = get('hospitalTier');
  const isCivilService = get('isCivilService');
  const tenureRange = get('tenureRange');

  if (!hospitalName || hospitalName.length > 60) return { error: '醫院名稱需為 1-60 字。' };
  if (!REGION_ORDER.includes(region)) return { error: '地區不正確。' };
  if (!TIER_OPTIONS.includes(hospitalTier)) return { error: '醫院層級不正確。' };
  if (!CIVIL_OPTIONS.includes(isCivilService)) return { error: '是否為公職不正確。' };
  if (!TENURE_OPTIONS.includes(tenureRange)) return { error: '年資範圍不正確。' };

  const data = { hospitalName, region, hospitalTier, isCivilService, tenureRange };

  const nurseLadder = get('nurseLadder');
  if (nurseLadder) data.nurseLadder = nurseLadder;
  const unitType = get('unitType');
  if (unitType) data.unitType = unitType;

  const numFieldLabels = { baseSalary: '底薪', eveningDiff: '小夜津貼', nightDiff: '大夜津貼', estimatedAnnualSalary: '推估年薪' };
  const numFields = [['baseSalary', 500000], ['eveningDiff', 5000], ['nightDiff', 5000], ['estimatedAnnualSalary', 5000000]];
  for (const [name, max] of numFields) {
    const r = optionalNumber(get(name), max);
    if (r.present && !r.valid) return { error: numFieldLabels[name] + '需為 0～' + max.toLocaleString('en-US') + ' 之間的數字。' };
    if (r.present) data[name] = r.value;
  }

  const yearEndBonus = get('yearEndBonus').trim();
  if (yearEndBonus) {
    if (yearEndBonus.length > 50) return { error: '年終獎金說明需在 50 字以內。' };
    data.yearEndBonus = yearEndBonus;
  }
  const notes = get('notes').trim();
  if (notes) {
    if (notes.length > 500) return { error: '備註需在 500 字以內。' };
    data.notes = notes;
  }

  return { data };
}

let pendingDocs = [];
let rejectedDocs = [];
let rejectedLoaded = false;
let stopPendingNotifications = null;

function updateNotificationUi() {
  const btn = document.getElementById('enable-notifications');
  const note = document.getElementById('notification-note');
  if (!('Notification' in window)) {
    btn.disabled = true;
    btn.textContent = '此瀏覽器不支援通知';
    note.textContent = '請直接查看待審核清單';
    return;
  }
  if (Notification.permission === 'granted') {
    btn.textContent = '🔔 新回報通知已開啟';
    note.textContent = '審核頁保持開啟時，有新回報會立即提醒';
  } else if (Notification.permission === 'denied') {
    btn.disabled = true;
    btn.textContent = '通知已被瀏覽器封鎖';
    note.textContent = '可在瀏覽器網站設定中重新允許通知';
  }
}

function startNotificationWatcher() {
  if (!('Notification' in window) || Notification.permission !== 'granted' || stopPendingNotifications) return;
  let firstSnapshot = true;
  const q = query(collection(db, 'salaryReports'), where('status', '==', 'pending'));
  stopPendingNotifications = onSnapshot(q, (snap) => {
    if (firstSnapshot) { firstSnapshot = false; return; }
    const additions = snap.docChanges().filter(change => change.type === 'added');
    additions.forEach((change) => {
      const data = change.doc.data();
      const notice = new Notification('Rex Nursing：有新的薪資回報', {
        body: (data.hospitalName || '未提供醫院名稱') + '，等待您審核。',
        tag: 'salary-report-' + change.doc.id,
      });
      notice.onclick = () => { window.focus(); notice.close(); };
    });
    if (additions.length) loadPending();
  }, (err) => console.error('[salary-admin] 通知監聽失敗', err));
}

async function loadPending() {
  const stateEl = document.getElementById('pending-state');
  const listEl = document.getElementById('pending-list');
  const emptyEl = document.getElementById('pending-empty');
  stateEl.style.display = 'block';
  stateEl.textContent = '載入中…';
  listEl.innerHTML = '';
  emptyEl.style.display = 'none';
  try {
    const q = query(collection(db, 'salaryReports'), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    pendingDocs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    pendingDocs.sort((a, b) => {
      const ta = a.data.createdAt && a.data.createdAt.toMillis ? a.data.createdAt.toMillis() : 0;
      const tb = b.data.createdAt && b.data.createdAt.toMillis ? b.data.createdAt.toMillis() : 0;
      return ta - tb;
    });
    document.getElementById('pending-count').textContent = pendingDocs.length;
    stateEl.style.display = 'none';
    if (pendingDocs.length === 0) {
      emptyEl.style.display = 'block';
    } else {
      listEl.innerHTML = pendingDocs.map(({ id, data }) => reviewCardHtml(id, data)).join('');
      listEl.querySelectorAll('.review-card').forEach(cardEl => {
        cardEl.querySelector('[data-action="approve"]').addEventListener('click', () => handleApprove(cardEl));
        cardEl.querySelector('[data-action="reject"]').addEventListener('click', () => handleReject(cardEl));
      });
    }
  } catch (err) {
    console.error('[salary-admin] 載入待審核失敗', err);
    stateEl.style.display = 'block';
    stateEl.textContent = '⚠️ 載入失敗，請重新整理頁面再試一次。';
  }
}

async function handleApprove(cardEl) {
  const id = cardEl.dataset.id;
  const msgEl = cardEl.querySelector('.review-msg');
  const result = collectAndValidate(cardEl);
  if (result.error) {
    msgEl.textContent = '⚠️ ' + result.error;
    msgEl.className = 'review-msg review-msg-error';
    return;
  }
  msgEl.textContent = '';
  msgEl.className = 'review-msg';
  const btns = cardEl.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  try {
    await updateDoc(doc(db, 'salaryReports', id), { ...result.data, status: 'approved', reviewedAt: serverTimestamp() });
    localStorage.removeItem('rex_salary_approved_cache_v1');
    cardEl.remove();
    pendingDocs = pendingDocs.filter(p => p.id !== id);
    document.getElementById('pending-count').textContent = pendingDocs.length;
    if (pendingDocs.length === 0) document.getElementById('pending-empty').style.display = 'block';
  } catch (err) {
    console.error('[salary-admin] 核准失敗', err);
    msgEl.textContent = '⚠️ 核准失敗，請再試一次。';
    msgEl.className = 'review-msg review-msg-error';
    btns.forEach(b => b.disabled = false);
  }
}

async function handleReject(cardEl) {
  const id = cardEl.dataset.id;
  const msgEl = cardEl.querySelector('.review-msg');
  const btns = cardEl.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  try {
    await updateDoc(doc(db, 'salaryReports', id), { status: 'rejected', reviewedAt: serverTimestamp() });
    cardEl.remove();
    pendingDocs = pendingDocs.filter(p => p.id !== id);
    document.getElementById('pending-count').textContent = pendingDocs.length;
    if (pendingDocs.length === 0) document.getElementById('pending-empty').style.display = 'block';
  } catch (err) {
    console.error('[salary-admin] 退回失敗', err);
    msgEl.textContent = '⚠️ 退回失敗，請再試一次。';
    msgEl.className = 'review-msg review-msg-error';
    btns.forEach(b => b.disabled = false);
  }
}

async function loadRejected() {
  const listEl = document.getElementById('rejected-list');
  listEl.innerHTML = '<div class="empty-queue">載入中…</div>';
  try {
    const q = query(collection(db, 'salaryReports'), where('status', '==', 'rejected'));
    const snap = await getDocs(q);
    rejectedDocs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    rejectedDocs.sort((a, b) => {
      const ta = a.data.reviewedAt && a.data.reviewedAt.toMillis ? a.data.reviewedAt.toMillis() : 0;
      const tb = b.data.reviewedAt && b.data.reviewedAt.toMillis ? b.data.reviewedAt.toMillis() : 0;
      return tb - ta;
    });
    document.getElementById('rejected-count-badge').textContent = rejectedDocs.length;
    document.getElementById('rejected-count-badge').style.display = 'inline-block';
    if (rejectedDocs.length === 0) {
      listEl.innerHTML = '<div class="empty-queue">目前沒有已退回的項目。</div>';
    } else {
      listEl.innerHTML = rejectedDocs.map(({ id, data }) => rejectedCardHtml(id, data)).join('');
      listEl.querySelectorAll('.rejected-card').forEach(cardEl => {
        cardEl.querySelector('[data-action="restore"]').addEventListener('click', () => handleRestore(cardEl));
      });
    }
    rejectedLoaded = true;
  } catch (err) {
    console.error('[salary-admin] 載入已退回項目失敗', err);
    listEl.innerHTML = '<div class="empty-queue">⚠️ 載入失敗，請再試一次。</div>';
  }
}

async function handleRestore(cardEl) {
  const id = cardEl.dataset.id;
  const btn = cardEl.querySelector('[data-action="restore"]');
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'salaryReports', id), { status: 'pending' });
    cardEl.remove();
    rejectedDocs = rejectedDocs.filter(r => r.id !== id);
    document.getElementById('rejected-count-badge').textContent = rejectedDocs.length;
    await loadPending();
  } catch (err) {
    console.error('[salary-admin] 恢復失敗', err);
    btn.disabled = false;
  }
}

document.getElementById('toggle-rejected').addEventListener('click', async () => {
  const listEl = document.getElementById('rejected-list');
  const isOpen = listEl.style.display === 'flex';
  const labelEl = document.getElementById('toggle-rejected-label');
  if (isOpen) {
    listEl.style.display = 'none';
    labelEl.textContent = '查看已退回項目';
  } else {
    listEl.style.display = 'flex';
    labelEl.textContent = '收合已退回項目';
    if (!rejectedLoaded) await loadRejected();
  }
});

document.getElementById('google-signin').addEventListener('click', () => {
  const provider = new GoogleAuthProvider();
  document.getElementById('login-error').textContent = '';
  signInWithPopup(auth, provider).catch(err => {
    console.error('[salary-admin] 登入失敗', err);
    document.getElementById('login-error').textContent = '登入失敗，請再試一次。';
  });
});

document.getElementById('sign-out-denied').addEventListener('click', () => signOut(auth));
document.getElementById('sign-out-admin').addEventListener('click', () => signOut(auth));
document.getElementById('enable-notifications').addEventListener('click', async () => {
  if (!('Notification' in window)) return;
  const permission = await Notification.requestPermission();
  updateNotificationUi();
  if (permission === 'granted') startNotificationWatcher();
});

function showState(state) {
  document.getElementById('login-box').style.display = state === 'login' ? 'block' : 'none';
  document.getElementById('denied-box').style.display = state === 'denied' ? 'block' : 'none';
  document.getElementById('admin-box').style.display = state === 'admin' ? 'block' : 'none';
}

onAuthStateChanged(auth, (user) => {
  if (!user) {
    if (stopPendingNotifications) { stopPendingNotifications(); stopPendingNotifications = null; }
    showState('login');
    return;
  }
  if (user.email !== ADMIN_EMAIL) {
    document.getElementById('denied-email').textContent = user.email || '';
    showState('denied');
    return;
  }
  showState('admin');
  updateNotificationUi();
  startNotificationWatcher();
  loadPending();
});
</script>
</body></html>
