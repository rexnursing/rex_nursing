name: Sync approved salary data

on:
  schedule:
    # 免費版每 6 小時同步一次；新核准資料最晚約 6 小時公開。
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: salary-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 讀取已核准資料並產生公開 JSON
        run: node scripts/sync-salary-data.mjs

      - name: 有資料變更時提交回 main
        shell: bash
        run: |
          if git diff --quiet -- assets/salary/approved-reports.json; then
            echo "No approved salary data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/salary/approved-reports.json
          git commit -m "自動同步已核准薪資資料"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run generate-question-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
